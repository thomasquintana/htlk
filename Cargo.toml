[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = ["crates-io"]
repository = "https://github.com/thomasquintana/htlk"

[workspace.dependencies]
actix = "0.13.5"
async-openai = { version = "0.41.3", default-features = false, features = [
    "byot",
    "chat-completion",
    "embedding",
    "rustls",
] }
chumsky = "0.13.0"
half = { version = "2.7.1", default-features = false }
htlk-cbor = { version = "=0.1.0", path = "crates/htlk-cbor" }
htlk-compiler = { version = "=0.1.0", path = "crates/htlk-compiler" }
htlk-executable = { version = "=0.1.0", path = "crates/htlk-executable" }
htlk-rt = { version = "=0.1.0", path = "crates/htlk-rt" }
iri-string = "0.7.14"
logos = "0.16.1"
miette = "7.6.0"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
rmcp = { version = "3.1.4", default-features = false, features = [
    "auth-client-credentials-jwt",
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
ryu-js = "1.0.3"
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlite-vec = "0.1.9"
tera = "2.2.0"
tokio-rusqlite = { version = "0.7.0", default-features = false, features = [
    "bundled",
] }
url = "2.5.8"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "htlk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "A facade for the Harness Toolkit compiler and actor-based runtime"
readme = "README.md"
exclude = ["docs/.plan-*.md"]
documentation = "https://docs.rs/htlk"
keywords = ["harness", "compiler", "runtime", "toolkit"]
categories = ["compilers", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
htlk-compiler.workspace = true
htlk-rt.workspace = true

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
