[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = ["crates-io"]
repository = "https://github.com/thomasquintana/htlk"

[workspace.dependencies]
actix = "0.13.5"
base64 = "0.22.1"
cbor2 = { version = "=1.1.5", default-features = false }
half = { version = "=2.7.1", default-features = false }
htlk-compiler = { version = "=0.1.0", path = "crates/htlk-compiler" }
htlk-analyzer = { version = "=0.1.0", path = "crates/htlk-analyzer" }
htlk-executable = { version = "=0.1.0", path = "crates/htlk-executable" }
htlk-runtime = { version = "=0.1.0", path = "crates/htlk-runtime", default-features = false }
iri-string = "=0.7.14"
jsonschema = { version = "=0.56.0", default-features = false }
regex = "=1.13.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.3", features = ["process", "io-util", "time", "sync", "macros"] }
ryu-js = "=1.0.3"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "=0.10.9"
postgres = "=0.19.14"
postgres-native-tls = "=0.5.3"
native-tls = "=0.2.18"
rusqlite = { version = "=0.41.1", default-features = false, features = [
    "bundled",
    "cache",
    "fallible_uint",
] }
url = "=2.5.8"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "htlk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "A facade for the Harness Toolkit compiler and actor-based runtime"
readme = "README.md"
documentation = "https://docs.rs/htlk"
keywords = ["harness", "compiler", "runtime", "toolkit"]
categories = ["compilers", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
htlk-compiler.workspace = true
htlk-runtime = { workspace = true, default-features = false }

[features]
default = ["sqlite"]
sqlite = ["htlk-runtime/sqlite"]
postgres = ["htlk-runtime/postgres"]

[dev-dependencies]
actix.workspace = true
postgres.workspace = true
htlk-executable.workspace = true
htlk-analyzer.workspace = true
tokio.workspace = true

[[example]]
name = "interactive_guide"
path = "examples/interactive_guide/main.rs"
test = true

[[example]]
name = "mcp_capability_spike"
path = "examples/mcp_capability_spike/main.rs"
test = true

[[example]]
name = "mcp_live_session"
path = "examples/live_session/main.rs"
test = true

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
