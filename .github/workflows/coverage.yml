name: Coverage and deep tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: ${{ matrix.mode }} coverage and complete suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Coverage maps do not require the much larger type-level debug data.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      HTLK_TEST_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=htlk-test dbname=htlk_test sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: htlk-test
          POSTGRES_DB: htlk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d htlk_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: line
            toolchain: 1.98.0
            flags: ''
            thresholds: tools/coverage-thresholds.json
          - mode: branch
            toolchain: nightly-2026-10-20
            flags: --branch
            thresholds: tools/coverage-branch-thresholds.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust and LLVM tools
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview

      - name: Install Node.js for independent wire peers
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ matrix.mode }}
          cache-targets: false

      - name: Install coverage collector
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Check coverage report integrity and baseline tooling
        run: node --test tools/coverage.test.mjs

      - name: Clean coverage artifacts before accumulating backend runs
        run: cargo +${{ matrix.toolchain }} llvm-cov clean --workspace

      - name: Execute all unit, integration, native E2E, crash and stress tests
        run: cargo +${{ matrix.toolchain }} llvm-cov --workspace --all-features --all-targets --locked ${{ matrix.flags }} --no-report

      - name: Accumulate complete PostgreSQL backend coverage
        env:
          HTLK_TEST_BACKEND: postgres
        # --no-report already preserves profiles for the final combined report.
        run: cargo +${{ matrix.toolchain }} llvm-cov --workspace --all-features --all-targets --locked ${{ matrix.flags }} --no-report

      - name: Export coverage evidence
        if: always()
        run: |
          mkdir -p target/coverage
          cargo +${{ matrix.toolchain }} llvm-cov report --workspace --json --output-path target/coverage/coverage.json
          cargo +${{ matrix.toolchain }} llvm-cov report --workspace --lcov --output-path target/coverage/lcov.info
          cargo +${{ matrix.toolchain }} llvm-cov report --workspace --html --output-dir target/coverage

      - name: Validate measurements and report advisory coverage baselines
        run: node tools/coverage.mjs target/coverage/coverage.json --recommendations ${{ matrix.thresholds }}

      - name: Write per-crate summary
        if: always()
        run: node tools/coverage.mjs target/coverage/coverage.json --recommendations ${{ matrix.thresholds }} >> "$GITHUB_STEP_SUMMARY"

      - name: Upload annotated coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.mode }}-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: error
          retention-days: 30
