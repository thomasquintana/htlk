name: PostgreSQL conformance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.version }} complete suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['16', '18']
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      HTLK_TEST_BACKEND: postgres
      HTLK_TEST_POSTGRES_VERSION: ${{ matrix.version }}
      HTLK_TEST_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=htlk-test dbname=htlk_test sslmode=disable
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_PASSWORD: htlk-test
          POSTGRES_DB: htlk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d htlk_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js for independent wire peers
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: postgres-${{ matrix.version }}-line-tables

      - name: Execute complete PostgreSQL compiler/runtime, crash and stress suites
        run: cargo test --workspace --all-features --locked

      - name: Exercise the PostgreSQL-only embedding and host example
        run: cargo test -p htlk-runtime --no-default-features --features postgres --lib --example mcp_client --locked
