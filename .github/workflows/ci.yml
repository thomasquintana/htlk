name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage and deep tests
    uses: ./.github/workflows/coverage.yml

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint GitHub Actions workflows
        run: actionlint

  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      # Keep source-line diagnostics while bounding the full suite's binary size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: line-tables

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate documentation links and anchors
        run: node tools/validate-docs.mjs

      - name: Validate specifications
        run: node specs/validate-specs.mjs

      - name: Independently validate executable fixtures
        run: node tools/validate-executable-fixtures.mjs

      - name: Test documentation, coverage and discovery helpers
        run: node --test tools/validate-docs.test.mjs tools/coverage.test.mjs tools/discover-mcp.test.mjs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Upload API documentation
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc-${{ github.sha }}
          path: target/doc/
          if-no-files-found: error
          retention-days: 30

      - name: Verify workspace packages
        run: cargo package --workspace --locked --target-dir "$RUNNER_TEMP/htlk-package-$GITHUB_SHA"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Check third-party notices
        run: |
          cargo about generate about.hbs --workspace --all-features --locked --fail --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES"
          diff --unified THIRD_PARTY_LICENSES "$RUNNER_TEMP/THIRD_PARTY_LICENSES"
