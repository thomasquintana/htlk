name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install actionlint
        uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12

      - name: Lint GitHub Actions workflows
        run: actionlint

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate specifications
        run: node specs/validate-specs.mjs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-${{ github.sha }}
          path: target/doc/
          if-no-files-found: error
          retention-days: 30

      - name: Verify workspace packages
        run: cargo package --workspace --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Check third-party notices
        run: |
          cargo about generate about.hbs --workspace --locked --fail --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES"
          diff --unified THIRD_PARTY_LICENSES "$RUNNER_TEMP/THIRD_PARTY_LICENSES"
