name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Validate release credentials
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured in the crates-io environment"
            exit 1
          fi

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_versions="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)"

          if [[ "$workspace_versions" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match workspace version(s):"
            echo "$workspace_versions"
            exit 1
          fi

      - name: Validate workspace
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --locked
          cargo doc --workspace --all-features --no-deps --locked

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Check third-party notices
        run: |
          cargo about generate about.hbs --workspace --locked --fail --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES"
          diff --unified THIRD_PARTY_LICENSES "$RUNNER_TEMP/THIRD_PARTY_LICENSES"

      - name: Validate component packages
        run: |
          cargo package -p htlk-compiler --locked
          cargo package -p htlk-ir --locked
          cargo package -p htlk-rt --locked

      - name: Publish crates
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          crate_exists() {
            curl \
              --fail \
              --silent \
              --show-error \
              --user-agent "htlk-release-workflow" \
              "https://crates.io/api/v1/crates/$1/$version" \
              > /dev/null
          }

          publish_if_needed() {
            if crate_exists "$1"; then
              echo "$1 $version is already published"
            else
              cargo publish -p "$1" --locked
            fi
          }

          for crate in htlk-compiler htlk-ir htlk-rt; do
            publish_if_needed "$crate"
          done

          for crate in htlk-compiler htlk-ir htlk-rt; do
            for attempt in {1..30}; do
              if crate_exists "$crate"; then
                break
              fi
              if [[ "$attempt" == 30 ]]; then
                echo "Timed out waiting for $crate $version to reach crates.io"
                exit 1
              fi
              sleep 10
            done
          done

          publish_if_needed htlk
