name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and package without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release and build docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate release version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages | map(.version) | unique | if length == 1 then .[0] else error("Workspace versions differ") end')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "${GITHUB_REF_NAME#v}" != "$workspace_version" ]]; then
              echo "::error::Release tag must be v$workspace_version"
              exit 1
            fi
          elif [[ "$DRY_RUN" != "true" ]]; then
            echo "::error::Publishing requires a matching version tag; use dry_run for branch validation"
            exit 1
          fi

      - name: Validate specifications
        run: node specs/validate-specs.mjs

      - name: Independently validate executable fixtures
        run: node tools/validate-executable-fixtures.mjs

      - name: Validate workspace
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --locked
          cargo doc --workspace --all-features --no-deps --locked

      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: release-rustdoc-${{ github.sha }}
          path: target/doc/
          if-no-files-found: error
          retention-days: 90

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Check third-party notices
        run: |
          cargo about generate about.hbs --workspace --locked --fail --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES"
          diff --unified THIRD_PARTY_LICENSES "$RUNNER_TEMP/THIRD_PARTY_LICENSES"

      - name: Validate workspace packages
        run: |
          cargo package --workspace --locked --target-dir "$RUNNER_TEMP/htlk-package-$GITHUB_SHA"

      - name: Upload crate packages
        uses: actions/upload-artifact@v4
        with:
          name: crates-${{ github.sha }}
          path: ${{ runner.temp }}/htlk-package-${{ github.sha }}/package/*.crate
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish crates
    needs: validate
    if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured in the crates-io environment"
            exit 1
          fi

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          crate_exists() {
            curl \
              --fail \
              --silent \
              --show-error \
              --user-agent "htlk-release-workflow" \
              "https://crates.io/api/v1/crates/$1/$version" \
              > /dev/null
          }

          publish_if_needed() {
            if crate_exists "$1"; then
              echo "$1 $version is already published"
            else
              cargo publish -p "$1" --locked
            fi
          }

          wait_for_crate() {
            local crate="$1"
            for attempt in {1..30}; do
              if crate_exists "$crate"; then
                return
              fi
              if [[ "$attempt" == 30 ]]; then
                echo "Timed out waiting for $crate $version to reach crates.io"
                exit 1
              fi
              sleep 10
            done
          }

          publish_if_needed htlk-executable
          wait_for_crate htlk-executable

          publish_if_needed htlk-analyzer
          wait_for_crate htlk-analyzer

          for crate in htlk-compiler htlk-runtime; do
            publish_if_needed "$crate"
          done

          for crate in htlk-compiler htlk-runtime; do
            wait_for_crate "$crate"
          done

          publish_if_needed htlk
