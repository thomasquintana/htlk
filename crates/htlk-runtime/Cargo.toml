[package]
name = "htlk-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "HTLK native runtime admission, checked expression execution, and actor foundations"
readme = "README.md"
documentation = "https://docs.rs/htlk-runtime"
keywords = ["harness", "runtime", "toolkit"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
actix.workspace = true
htlk-executable.workspace = true
htlk-analyzer.workspace = true
base64.workspace = true
iri-string.workspace = true
regex.workspace = true
regex-automata.workspace = true
regex-syntax.workspace = true
ryu-js.workspace = true
sha2.workspace = true
reqwest.workspace = true
tokio.workspace = true
rusqlite = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }
postgres-native-tls = { workspace = true, optional = true }
native-tls = { workspace = true, optional = true }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]

[lints]
workspace = true
