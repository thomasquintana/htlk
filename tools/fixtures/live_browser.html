<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTLK controlled browser fixture</title>
  <style>
    body { font: 16px sans-serif; margin: 24px; background: white; color: #123; }
    input, button, .drag { display: block; margin: 12px; padding: 10px; }
    .drag { width: 130px; height: 45px; border: 2px solid blue; }
    #styled { color: rgb(10, 20, 30); }
  </style>
</head>
<body>
  <h1 id="marker">__MARKER__</h1>
  <h2 id="styled">Styled heading</h2>
  <button id="click" onclick="document.getElementById('status').textContent='clicked'">Click target</button>
  <label>First field<input id="first" aria-label="First field"></label>
  <label>Second field<input id="second" aria-label="Second field"></label>
  <label>Upload file<input id="upload" type="file" aria-label="Upload file"></label>
  <div class="drag" role="button" aria-label="Drag source" draggable="true"
       ondragstart="event.dataTransfer.setData('text/plain','synthetic')">Drag source</div>
  <div class="drag" role="button" aria-label="Drop target"
       ondragover="event.preventDefault()"
       ondrop="event.preventDefault();document.getElementById('status').textContent='dropped'">Drop target</div>
  <p id="status" aria-live="polite">ready</p>
  <script>
    console.log('HTLK console marker');
    fetch('/payload.json').then(response => response.json()).then(value => {
      window.fixtureResponse = value;
    });
    document.getElementById('upload').addEventListener('change', event => {
      document.getElementById('status').textContent = event.target.files[0].name;
    });
  </script>
</body>
</html>
